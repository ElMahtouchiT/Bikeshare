# Page Conditions
conditions.title=Rental terms
conditions.intro=These terms govern peer-to-peer bike rental through the BikeShare platform.
conditions.s1.title=1. Purpose
conditions.s1.text=BikeShare connects bike owners and renters. The platform facilitates booking and communication, but the rental contract is concluded between the renter and the owner.
conditions.s2.title=2. Booking and payment
conditions.s2.text=The booking is confirmed according to the mode chosen by the owner (manual or automatic). The daily rate is shown on the bike page; discounts apply from 3 and 7 days. Payment is made online at confirmation.
conditions.s3.title=3. Duration and return
conditions.s3.text=The bike must be returned on the agreed date, in the condition it was handed over. Any delay or damage may result in additional charges.
conditions.s4.title=4. Bike condition and liability
conditions.s4.text=The renter undertakes to use the bike responsibly and to obey traffic rules. They are responsible for the bike throughout the rental, including in case of theft or damage.
conditions.s5.title=5. Cancellation
conditions.s5.text=A booking can be cancelled as long as it has not started. Cancellation and refund conditions depend on the notice period.
conditions.s6.title=6. Disputes
conditions.s6.text=In case of disagreement, renter and owner are encouraged to use the platform messaging. A <a href="/reclamation">complaint</a> can be filed with BikeShare. Failing an amicable agreement, the courts of Brussels have jurisdiction.
common.lastUpdate=Last updated:

# Page Mentions légales
legal.title=Legal notice
legal.editor.title=Site publisher
legal.editor.text=BikeShare — peer-to-peer bike rental platform.<br/>Boulevard Anspach 1, 1000 Brussels, Belgium.<br/>Contact: <a href="mailto:contact@bikeshare.be">contact@bikeshare.be</a>.<br/>Project carried out as a final-year work (ICC Brussels).
legal.hosting.title=Hosting
legal.hosting.text=The site is hosted on cloud infrastructure. The host's details are available on request.
legal.ip.title=Intellectual property
legal.ip.text=All content (text, logos, layout) is protected by copyright. Any reproduction without authorization is prohibited. Bike photos remain the property of their respective authors.
legal.gdpr.title=Personal data (GDPR)
legal.gdpr.text1=In accordance with the General Data Protection Regulation (GDPR), the data collected (name, e-mail, address, bank details) is used solely to operate the service. You have the right to access, rectify and delete your data.
legal.gdpr.text2=You can exercise your <strong>right to be forgotten</strong> directly from your member area ("My profile" → account deletion request) or by writing to us at <a href="mailto:contact@bikeshare.be">contact@bikeshare.be</a>.
legal.cookies.title=Cookies
legal.cookies.text=The site uses only the technical cookies necessary for authentication and proper session operation.
legal.law.title=Applicable law
legal.law.text=This site is subject to Belgian law.

