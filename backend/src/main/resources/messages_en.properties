# Page À propos
about.title=About BikeShare
about.subtitle=Peer-to-peer bike rental in Brussels.
about.project.title=The project
about.project.text=BikeShare is a web platform that connects individuals to rent bikes in Brussels and its surroundings. The idea: help everyone easily find a bike nearby — city bike, electric, MTB, cargo… — and let owners make the most of their bike when they aren't using it. All in a spirit of <strong>soft mobility</strong>, the sharing economy and conviviality.
about.author.title=The author
about.author.role=Student — ICC Brussels
about.author.text=BikeShare is my <strong>final-year project (TFE)</strong>. Passionate about web development and new technologies, I wanted to build a complete application — from the back-end to the user experience — around a topic close to my heart: mobility and sharing. This project let me put all my skills into practice: design, security, online payment and deployment, on a real, usable product.
about.author.note=(Text to customize freely.)
about.underhood.title=Under the hood
about.underhood.intro=Some technologies used for this project:
