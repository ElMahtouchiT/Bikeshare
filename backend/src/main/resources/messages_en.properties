# === FAQ (page /faq) ===
footer.faq=FAQ
faq.title=Frequently asked questions
faq.intro=Here you will find answers to the most common questions about booking, payment, responsibilities, legal aspects and problem resolution.
faq.outro=Didn't find your answer? <a href="/contact">Contact us</a> or file a <a href="/reclamation">complaint</a>.
faq.cat.resa=Booking
faq.cat.pay=Payment
faq.cat.resp=Responsibilities
faq.cat.legal=Legal questions
faq.cat.help=Problem resolution
faq.resa.q1=How do I book a bike?
faq.resa.a1=Choose your dates on the bike page and confirm the booking. Depending on the mode set by the owner, it is validated immediately (automatic) or after the owner's approval (manual).
faq.resa.q2=What is the difference between manual and automatic booking?
faq.resa.a2=In automatic mode, the booking is accepted directly. In manual mode, the owner must approve it before payment is requested.
faq.resa.q3=Can I cancel a booking?
faq.resa.a3=Yes, as long as the rental has not started. A confirmed but unpaid booking is cancelled automatically after 24 hours.
faq.resa.q4=How do I contact the owner?
faq.resa.a4=An internal messaging system is available for each booking, allowing you to communicate with the owner before and during the rental.
faq.pay.q1=How does payment work?
faq.pay.a1=Payment is made online at confirmation, through Stripe, a secure payment provider certified PCI-DSS.
faq.pay.q2=Is my card data stored?
faq.pay.a2=No. No card data is stored by BikeShare: the entire payment is handled by Stripe.
faq.pay.q3=How is the amount split?
faq.pay.a3=BikeShare charges a 15% commission. The remaining 85% is paid to the owner after the rental.
faq.pay.q4=How do I get a refund?
faq.pay.a4=If you cancel before the rental starts, a refund is possible. Refunds are tracked and processed by the platform administration.
faq.resp.q1=Who is responsible for the bike during the rental?
faq.resp.a1=The renter is responsible for the bike throughout the rental, including in the event of theft or damage.
faq.resp.q2=Is there any insurance?
faq.resp.a2=An insurance option may be offered at the time of booking. Personal civil-liability insurance is also recommended.
faq.resp.q3=What are the owner's obligations?
faq.resp.a3=To provide a bike matching the listing, in good working order and maintained, and to hand it over at the agreed date and place.
faq.resp.q4=What are the renter's obligations?
faq.resp.a4=To use the bike reasonably, follow the highway code and return it on time, in its original condition.
faq.legal.q1=What is BikeShare's role?
faq.legal.a1=BikeShare is a technical intermediary that connects users. The rental contract is concluded directly between the owner and the renter.
faq.legal.q2=What happens to my personal data?
faq.legal.a2=It is processed in accordance with the GDPR. You have rights of access, rectification and erasure, among others.
faq.legal.q3=What happens if I delete my account?
faq.legal.a3=Your account is anonymised (logical deletion): your personal data is neutralised, but the accounting history (bookings, payments) is kept as required by law.
faq.legal.q4=Do you use cookies?
faq.legal.a4=Only strictly necessary cookies (session, security) are used; they do not require consent.
faq.help.q1=What should I do if there is a problem with a rental?
faq.help.a1=First contact the other party through the messaging system. If the disagreement persists, you can file a complaint with BikeShare.
faq.help.q2=How does a complaint work?
faq.help.a2=Your complaint is forwarded to the administration, which acts as a mediator and provides you with a response.
faq.help.q3=The owner does not hand over the bike, what should I do?
faq.help.a3=Report it: the booking can be refunded and the incident is taken into account (rating, monitoring of the owner's account).
faq.help.q4=The renter does not return the bike, what should I do?
faq.help.a4=Report it without delay. A formal notice and, if necessary, a complaint to the police are possible; the time-stamped messaging serves as evidence.
