<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Vérification en deux étapes — BikeShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/></head>
<body class="bg-light">
<div class="container" style="max-width:420px;margin-top:10vh">
  <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
    <h3 class="mb-3">🔐 Vérification en deux étapes</h3>
    <p class="text-muted">Saisissez le code à 6 chiffres affiché par votre application Authenticator.</p>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
    <form th:action="@{/2fa}" method="post">
      <input class="form-control form-control-lg text-center mb-3" name="code"
             inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="123456" autofocus required/>
      <button class="btn text-white w-100" style="background:#1fa67a;">Valider</button>
    </form>
    <form th:action="@{/logout}" method="post" class="mt-3 mb-0">
      <button class="btn btn-link btn-sm text-muted">Se déconnecter</button>
    </form>
  </div>
</div>
</body>
</html>
