<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Modifier l'annonce — BikeShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container py-5" style="max-width:720px;">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 th:text="#{editbike.title}">Modifier l'annonce</h2>
    <a th:href="@{/account/bikes}" class="btn btn-outline-secondary btn-sm" th:text="#{common.backMyBikes}">&larr; Mes vélos</a>
  </div>

  <!-- Photos existantes -->
  <div class="card shadow-sm border-0 rounded-4 p-4 mb-4">
    <h6 class="text-muted text-uppercase mb-3" style="font-size:.75rem;letter-spacing:.08em;" th:text="#{editbike.currentPhotos}">Photos actuelles</h6>
    <div th:if="${bike.photos == null or bike.photos.isEmpty()}" class="text-muted small" th:text="#{editbike.noPhotos}">
      Aucune photo pour ce vélo. Ajoutez-en ci-dessous.
    </div>
    <div class="row g-3" th:unless="${bike.photos == null or bike.photos.isEmpty()}">
      <div class="col-6 col-md-4" th:each="photo : ${bike.photos}">
        <div class="position-relative">
          <img class="img-fluid rounded-3 w-100" style="height:130px;object-fit:cover;" alt="photo du vélo"
               th:src="@{${photo.url}}"/>
          <form th:action="@{'/account/bikes/' + ${bike.id} + '/photos/' + ${photo.id} + '/delete'}"
                method="post" class="position-absolute top-0 end-0 m-1"
                th:attr="data-confirm=#{confirm.deletePhoto}">
            <button type="submit" class="btn btn-sm btn-danger rounded-circle" style="width:28px;height:28px;padding:0;"
                    title="Supprimer">&times;</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm border-0 rounded-4 p-4">
    <form th:action="@{'/account/bikes/' + ${bike.id} + '/edit'}" method="post" enctype="multipart/form-data">

      <!-- Identité du vélo -->
      <h6 class="text-muted text-uppercase mb-3" style="font-size:.75rem;letter-spacing:.08em;" th:text="#{bikeform.section.identity}">Identité du vélo</h6>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label"><span th:text="#{bikeform.brand}">Marque</span> <span class="text-danger">*</span></label>
          <input class="form-control" name="brand" th:value="${bike.brand}" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label"><span th:text="#{bikeform.model}">Modèle</span> <span class="text-danger">*</span></label>
          <input class="form-control" name="bikeModel" th:value="${bike.model}" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label"><span th:text="#{bikeform.type}">Type de vélo</span> <span class="text-danger">*</span></label>
          <select class="form-select" name="bikeType" required>
            <option value="" disabled th:selected="${bike.bikeType == null}" th:text="#{bikeform.choose}">Choisir…</option>
            <option value="CITY"     th:selected="${bike.bikeType == 'CITY'}" th:text="#{bikeform.type.city}">Vélo de ville</option>
            <option value="MTB"      th:selected="${bike.bikeType == 'MTB'}" th:text="#{bikeform.type.mtb}">VTT</option>
            <option value="ROAD"     th:selected="${bike.bikeType == 'ROAD'}" th:text="#{bikeform.type.road}">Vélo de route</option>
            <option value="ELECTRIC" th:selected="${bike.bikeType == 'ELECTRIC'}" th:text="#{bikeform.type.electric}">Vélo électrique</option>
            <option value="CARGO"    th:selected="${bike.bikeType == 'CARGO'}" th:text="#{bikeform.type.cargo}">Vélo cargo</option>
            <option value="OTHER"    th:selected="${bike.bikeType == 'OTHER'}" th:text="#{bikeform.type.other}">Autre</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" th:text="#{bikeform.category}">Catégorie</label>
          <select class="form-select" name="categoryId">
            <option value="" th:selected="${bike.category == null}" th:text="#{bikeform.none}">— Aucune —</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.category}"
                    th:selected="${bike.category != null and bike.category.id == cat.id}"></option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" th:text="#{bikeform.frameSize}">Taille de cadre</label>
          <select class="form-select" name="frameSize">
            <option value="" th:selected="${bike.frameSize == null}">—</option>
            <option th:selected="${bike.frameSize == 'XS'}">XS</option>
            <option th:selected="${bike.frameSize == 'S'}">S</option>
            <option th:selected="${bike.frameSize == 'M'}">M</option>
            <option th:selected="${bike.frameSize == 'L'}">L</option>
            <option th:selected="${bike.frameSize == 'XL'}">XL</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" th:text="#{bikeform.wheelSize}">Taille de roue</label>
          <select class="form-select" name="wheelSize">
            <option value="" th:selected="${bike.wheelSize == null}">—</option>
            <option value="26&quot;"   th:selected="${bike.wheelSize == '26&quot;'}">26"</option>
            <option value="27.5&quot;" th:selected="${bike.wheelSize == '27.5&quot;'}">27.5"</option>
            <option value="28&quot;"   th:selected="${bike.wheelSize == '28&quot;'}">28"</option>
            <option value="29&quot;"   th:selected="${bike.wheelSize == '29&quot;'}">29"</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" th:text="#{bike.show.gears}">Vitesses</label>
          <input class="form-control" type="number" name="gears" min="1" max="33" th:value="${bike.gears}"/>
        </div>
        <div class="col-12">
          <div class="form-check mt-1">
            <input class="form-check-input" type="checkbox" name="electric" id="electric" value="true"
                   th:checked="${bike.electric}"/>
            <label class="form-check-label" for="electric" th:text="#{bikeform.electric}">Vélo à assistance électrique (VAE)</label>
          </div>
        </div>
      </div>

      <!-- Localisation -->
      <h6 class="text-muted text-uppercase mb-3 mt-4" style="font-size:.75rem;letter-spacing:.08em;" th:text="#{bike.show.location}">Localisation</h6>
      <div class="row g-3 mb-3">
        <div class="col-12">
          <label class="form-label" th:text="#{bikeform.street}">Rue et numéro</label>
          <input class="form-control" name="adresse" th:value="${bike.adresse}" th:placeholder="#{bikeform.streetPlaceholder}" placeholder="Rue de la Loi 1"/>
        </div>
        <div class="col-md-4">
          <label class="form-label" th:text="#{bikeform.postalCode}">Code postal</label>
          <input class="form-control" name="postalCode" th:value="${bike.postalCode}" placeholder="1000"/>
        </div>
        <div class="col-md-8">
          <label class="form-label"><span th:text="#{bikeform.locality}">Localité</span> <span class="text-danger">*</span></label>
          <input class="form-control" name="locality" th:value="${bike.locality}" th:placeholder="#{bikeform.localityPlaceholder}" placeholder="Bruxelles" required/>
        </div>
      </div>

      <!-- Tarif et réservation -->
      <h6 class="text-muted text-uppercase mb-3 mt-4" style="font-size:.75rem;letter-spacing:.08em;" th:text="#{bikeform.section.pricing}">Tarif et réservation</h6>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label"><span th:text="#{bikeform.pricePerDayLabel}">Prix par jour (€)</span> <span class="text-danger">*</span></label>
          <div class="input-group">
            <input class="form-control" type="number" name="middlePrice" min="1" step="0.5"
                   th:value="${bike.price != null ? bike.price.middlePrice : ''}" required/>
            <span class="input-group-text" th:text="#{bikeform.perDay}">€/jour</span>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label" th:text="#{bike.show.reservationMode}">Mode de réservation</label>
          <select class="form-select" name="reservationMode">
            <option value="MANUAL"    th:selected="${bike.reservationMode == 'MANUAL' or bike.reservationMode == null}" th:text="#{bikeform.modeManual}">Manuel (vous acceptez chaque demande)</option>
            <option value="AUTOMATIC" th:selected="${bike.reservationMode == 'AUTOMATIC'}" th:text="#{bikeform.modeAuto}">Automatique</option>
          </select>
        </div>
      </div>

      <!-- Ajouter des photos -->
      <h6 class="text-muted text-uppercase mb-3 mt-4" style="font-size:.75rem;letter-spacing:.08em;" th:text="#{createbike.addPhotos}">Ajouter des photos</h6>
      <div class="mb-4">
        <input class="form-control" type="file" name="photos" accept="image/*" multiple/>
        <div class="form-text" th:text="#{editbike.photosHelp}">Les nouvelles photos s'ajoutent aux photos actuelles. 10 Mo maximum par fichier.</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn text-white px-4" style="background:#1fa67a;" th:text="#{editbike.submit}">Enregistrer les modifications</button>
        <a th:href="@{/account/bikes}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Annuler</a>
      </div>

    </form>
  </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
