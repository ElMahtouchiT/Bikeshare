<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Proposer un vélo — BikeShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container py-5" style="max-width:720px;">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 th:text="#{createbike.title}">Proposer un vélo</h2>
    <a th:href="@{/account/bikes}" class="btn btn-outline-secondary btn-sm" th:text="#{common.backMyBikes}">&larr; Mes vélos</a>
  </div>

  <div class="card shadow-sm border-0 rounded-4 p-4">
    <form th:action="@{/account/bikes/create}" method="post" enctype="multipart/form-data">

      <!-- Identité du vélo -->
      <h6 class="text-muted text-uppercase mb-3" style="font-size:.75rem;letter-spacing:.08em;" th:text="#{bikeform.section.identity}">Identité du vélo</h6>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label"><span th:text="#{bikeform.brand}">Marque</span> <span class="text-danger">*</span></label>
          <input class="form-control" name="brand" th:placeholder="#{bikeform.brandPlaceholder}" placeholder="Trek, Decathlon…" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label"><span th:text="#{bikeform.model}">Modèle</span> <span class="text-danger">*</span></label>
          <input class="form-control" name="bikeModel" th:placeholder="#{bikeform.modelPlaceholder}" placeholder="FX 3, Riverside 500…" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label"><span th:text="#{bikeform.type}">Type de vélo</span> <span class="text-danger">*</span></label>
          <select class="form-select" name="bikeType" required>
            <option value="" disabled selected th:text="#{bikeform.choose}">Choisir…</option>
            <option value="CITY" th:text="#{bikeform.type.city}">Vélo de ville</option>
            <option value="MTB" th:text="#{bikeform.type.mtb}">VTT</option>
            <option value="ROAD" th:text="#{bikeform.type.road}">Vélo de route</option>
            <option value="ELECTRIC" th:text="#{bikeform.type.electric}">Vélo électrique</option>
            <option value="CARGO" th:text="#{bikeform.type.cargo}">Vélo cargo</option>
            <option value="OTHER" th:text="#{bikeform.type.other}">Autre</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" th:text="#{bikeform.category}">Catégorie</label>
          <select class="form-select" name="categoryId">
            <option value="" th:text="#{bikeform.none}">— Aucune —</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.category}"></option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" th:text="#{bikeform.frameSize}">Taille de cadre</label>
          <select class="form-select" name="frameSize">
            <option value="">—</option>
            <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" th:text="#{bikeform.wheelSize}">Taille de roue</label>
          <select class="form-select" name="wheelSize">
            <option value="">—</option>
            <option value="26&quot;">26"</option>
            <option value="27.5&quot;">27.5"</option>
            <option value="28&quot;">28"</option>
            <option value="29&quot;">29"</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" th:text="#{bike.show.gears}">Vitesses</label>
          <input class="form-control" type="number" name="gears" min="1" max="33" th:placeholder="#{bikeform.gearsPlaceholder}" placeholder="ex : 7"/>
        </div>
        <div class="col-12">
          <div class="form-check mt-1">
            <input class="form-check-input" type="checkbox" name="electric" id="electric" value="true"/>
            <label class="form-check-label" for="electric" th:text="#{bikeform.electric}">Vélo à assistance électrique (VAE)</label>
          </div>
        </div>
      </div>

      <!-- Localisation -->
      <h6 class="text-muted text-uppercase mb-3 mt-4" style="font-size:.75rem;letter-spacing:.08em;" th:text="#{bike.show.location}">Localisation</h6>
      <div class="row g-3 mb-3">
        <div class="col-12">
          <label class="form-label" th:text="#{bikeform.street}">Rue et numéro</label>
          <input class="form-control" name="adresse" th:placeholder="#{bikeform.streetPlaceholder}" placeholder="Rue de la Loi 1"/>
        </div>
        <div class="col-md-4">
          <label class="form-label" th:text="#{bikeform.postalCode}">Code postal</label>
          <input class="form-control" name="postalCode" placeholder="1000"/>
        </div>
        <div class="col-md-8">
          <label class="form-label"><span th:text="#{bikeform.locality}">Localité</span> <span class="text-danger">*</span></label>
          <input class="form-control" name="locality" th:placeholder="#{bikeform.localityPlaceholder}" placeholder="Bruxelles" required/>
        </div>
      </div>

      <!-- Tarif et réservation -->
      <h6 class="text-muted text-uppercase mb-3 mt-4" style="font-size:.75rem;letter-spacing:.08em;" th:text="#{bikeform.section.pricing}">Tarif et réservation</h6>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label"><span th:text="#{bikeform.pricePerDayLabel}">Prix par jour (€)</span> <span class="text-danger">*</span></label>
          <div class="input-group">
            <input class="form-control" type="number" name="middlePrice" min="1" step="0.5"
                   th:placeholder="#{bikeform.pricePlaceholder}" placeholder="ex : 15" required/>
            <span class="input-group-text" th:text="#{bikeform.perDay}">€/jour</span>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label" th:text="#{bike.show.reservationMode}">Mode de réservation</label>
          <select class="form-select" name="reservationMode">
            <option value="MANUAL" selected th:text="#{bikeform.modeManual}">Manuel (vous acceptez chaque demande)</option>
            <option value="AUTOMATIC" th:text="#{bikeform.modeAuto}">Automatique</option>
          </select>
        </div>
      </div>

      <!-- Photos -->
      <h6 class="text-muted text-uppercase mb-3 mt-4" style="font-size:.75rem;letter-spacing:.08em;" th:text="#{createbike.section.photos}">Photos</h6>
      <div class="mb-4">
        <label class="form-label" th:text="#{createbike.addPhotos}">Ajouter des photos</label>
        <input class="form-control" type="file" name="photos" accept="image/*" multiple/>
        <div class="form-text" th:text="#{createbike.photosHelp}">Vous pouvez sélectionner plusieurs images (JPG, PNG…). 10 Mo maximum par fichier.</div>
      </div>

      <div class="alert alert-info small mb-4" th:text="#{createbike.reviewNote}">
        Votre vélo sera visible dans le catalogue après vérification par notre équipe.
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn text-white px-4" style="background:#1fa67a;" th:text="#{createbike.submit}">Enregistrer le vélo</button>
        <a th:href="@{/account/bikes}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Annuler</a>
      </div>

    </form>
  </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
