# Page À propos
about.title=À propos de BikeShare
about.subtitle=La location de vélos entre particuliers, à Bruxelles.
about.project.title=Le projet
about.project.text=BikeShare est une plateforme web qui met en relation des particuliers pour la location de vélos à Bruxelles et ses environs. L'idée : permettre à chacun de trouver facilement un vélo près de chez lui — vélo de ville, électrique, VTT, cargo… — et aux propriétaires de rentabiliser leur vélo quand ils ne s'en servent pas. Le tout dans une démarche de <strong>mobilité douce</strong>, d'économie du partage et de convivialité.
about.author.title=L'auteur
about.author.role=Étudiant — ICC Bruxelles
about.author.text=BikeShare est mon <strong>Travail de Fin d'Études (TFE)</strong>. Passionné de développement web et de nouvelles technologies, j'ai voulu construire une application complète — du back-end à l'expérience utilisateur — autour d'un sujet qui me tient à cœur : la mobilité et le partage. Ce projet m'a permis de mettre en pratique l'ensemble de mes compétences : conception, sécurité, paiement en ligne et déploiement, sur un produit réel et utilisable.
about.author.note=(Texte à personnaliser librement.)
about.underhood.title=Sous le capot
about.underhood.intro=Quelques technologies utilisées pour ce projet :
about.browseBikes=Parcourir les vélos →
about.contactUs=Nous contacter

