# Page Conditions
conditions.title=Conditions de location
conditions.intro=Les présentes conditions régissent la location de vélos entre particuliers via la plateforme BikeShare.
conditions.s1.title=1. Objet
conditions.s1.text=BikeShare met en relation des propriétaires de vélos et des locataires. La plateforme facilite la réservation et la communication, mais le contrat de location est conclu entre le locataire et le propriétaire.
conditions.s2.title=2. Réservation et paiement
conditions.s2.text=La réservation est confirmée selon le mode choisi par le propriétaire (manuel ou automatique). Le tarif journalier est affiché sur la fiche du vélo ; des réductions s'appliquent à partir de 3 et 7 jours. Le paiement s'effectue en ligne au moment de la confirmation.
conditions.s3.title=3. Durée et restitution
conditions.s3.text=Le vélo doit être restitué à la date convenue, dans l'état où il a été remis. Tout retard ou dégradation peut donner lieu à des frais supplémentaires.
conditions.s4.title=4. État du vélo et responsabilité
conditions.s4.text=Le locataire s'engage à utiliser le vélo en bon père de famille et à respecter le code de la route. Il est responsable du vélo pendant toute la durée de la location, y compris en cas de vol ou de dommage.
conditions.s5.title=5. Annulation
conditions.s5.text=Une réservation peut être annulée tant qu'elle n'a pas débuté. Les conditions d'annulation et de remboursement dépendent du délai de prévenance.
conditions.s6.title=6. Litiges
conditions.s6.text=En cas de désaccord, locataire et propriétaire sont invités à utiliser la messagerie de la plateforme. Une <a href="/reclamation">réclamation</a> peut être déposée auprès de BikeShare. À défaut d'accord amiable, les tribunaux de Bruxelles sont compétents.
common.lastUpdate=Dernière mise à jour :

# Page Mentions légales
legal.title=Mentions légales
legal.editor.title=Éditeur du site
legal.editor.text=BikeShare — plateforme de location de vélos entre particuliers.<br/>Boulevard Anspach 1, 1000 Bruxelles, Belgique.<br/>Contact : <a href="mailto:contact@bikeshare.be">contact@bikeshare.be</a>.<br/>Projet réalisé dans le cadre d'un travail de fin d'études (ICC Bruxelles).
legal.hosting.title=Hébergement
legal.hosting.text=Le site est hébergé sur une infrastructure cloud. Les coordonnées de l'hébergeur sont disponibles sur demande.
legal.ip.title=Propriété intellectuelle
legal.ip.text=L'ensemble des contenus (textes, logos, mise en page) est protégé par le droit d'auteur. Toute reproduction sans autorisation est interdite. Les photos de vélos restent la propriété de leurs auteurs respectifs.
legal.gdpr.title=Données personnelles (RGPD)
legal.gdpr.text1=Conformément au Règlement général sur la protection des données (RGPD), les données collectées (nom, e-mail, adresse, coordonnées bancaires) sont utilisées uniquement pour le fonctionnement du service. Vous disposez d'un droit d'accès, de rectification et de suppression de vos données.
legal.gdpr.text2=Vous pouvez exercer votre <strong>droit à l'oubli</strong> directement depuis votre espace membre (« Mon profil » → demande de suppression de compte) ou en nous écrivant à <a href="mailto:contact@bikeshare.be">contact@bikeshare.be</a>.
legal.cookies.title=Cookies
legal.cookies.text=Le site utilise uniquement les cookies techniques nécessaires à l'authentification et au bon fonctionnement de la session.
legal.law.title=Droit applicable
legal.law.text=Le présent site est soumis au droit belge.

