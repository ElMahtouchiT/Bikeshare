# Page Conditions
conditions.title=Huurvoorwaarden
conditions.intro=Deze voorwaarden regelen het huren van fietsen tussen particulieren via het BikeShare-platform.
conditions.s1.title=1. Voorwerp
conditions.s1.text=BikeShare brengt fietseigenaars en huurders samen. Het platform faciliteert de reservering en de communicatie, maar de huurovereenkomst wordt gesloten tussen de huurder en de eigenaar.
conditions.s2.title=2. Reservering en betaling
conditions.s2.text=De reservering wordt bevestigd volgens de door de eigenaar gekozen modus (handmatig of automatisch). Het dagtarief staat op de fietspagina; kortingen gelden vanaf 3 en 7 dagen. De betaling gebeurt online bij bevestiging.
conditions.s3.title=3. Duur en teruggave
conditions.s3.text=De fiets moet op de afgesproken datum worden teruggegeven, in de staat waarin hij werd overhandigd. Elke vertraging of beschadiging kan leiden tot bijkomende kosten.
conditions.s4.title=4. Staat van de fiets en aansprakelijkheid
conditions.s4.text=De huurder verbindt zich ertoe de fiets als een goede huisvader te gebruiken en de verkeersregels na te leven. Hij is verantwoordelijk voor de fiets gedurende de volledige huurperiode, ook bij diefstal of schade.
conditions.s5.title=5. Annulering
conditions.s5.text=Een reservering kan worden geannuleerd zolang ze niet is begonnen. De annulerings- en terugbetalingsvoorwaarden hangen af van de opzegtermijn.
conditions.s6.title=6. Geschillen
conditions.s6.text=Bij onenigheid worden huurder en eigenaar aangemoedigd de berichtenfunctie van het platform te gebruiken. Er kan een <a href="/reclamation">klacht</a> worden ingediend bij BikeShare. Bij gebrek aan een minnelijke schikking zijn de rechtbanken van Brussel bevoegd.
common.lastUpdate=Laatst bijgewerkt:

# Page Mentions légales
legal.title=Wettelijke vermeldingen
legal.editor.title=Uitgever van de site
legal.editor.text=BikeShare — platform voor het huren van fietsen tussen particulieren.<br/>Anspachlaan 1, 1000 Brussel, België.<br/>Contact: <a href="mailto:contact@bikeshare.be">contact@bikeshare.be</a>.<br/>Project gerealiseerd in het kader van een eindwerk (ICC Brussel).
legal.hosting.title=Hosting
legal.hosting.text=De site wordt gehost op een cloudinfrastructuur. De gegevens van de host zijn op aanvraag beschikbaar.
legal.ip.title=Intellectuele eigendom
legal.ip.text=Alle inhoud (teksten, logo's, opmaak) is beschermd door het auteursrecht. Elke reproductie zonder toestemming is verboden. Fietsfoto's blijven eigendom van hun respectieve auteurs.
legal.gdpr.title=Persoonsgegevens (AVG)
legal.gdpr.text1=In overeenstemming met de Algemene Verordening Gegevensbescherming (AVG) worden de verzamelde gegevens (naam, e-mail, adres, bankgegevens) uitsluitend gebruikt voor de werking van de dienst. U hebt recht op inzage, rectificatie en verwijdering van uw gegevens.
legal.gdpr.text2=U kunt uw <strong>recht om vergeten te worden</strong> rechtstreeks uitoefenen vanuit uw ledenzone ("Mijn profiel" → verzoek tot verwijdering van account) of door ons te schrijven op <a href="mailto:contact@bikeshare.be">contact@bikeshare.be</a>.
legal.cookies.title=Cookies
legal.cookies.text=De site gebruikt uitsluitend de technische cookies die nodig zijn voor authenticatie en de goede werking van de sessie.
legal.law.title=Toepasselijk recht
legal.law.text=Deze site is onderworpen aan het Belgische recht.

