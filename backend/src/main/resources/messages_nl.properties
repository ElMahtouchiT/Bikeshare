# Page À propos
about.title=Over BikeShare
about.subtitle=Fietsen huren tussen particulieren, in Brussel.
about.project.title=Het project
about.project.text=BikeShare is een webplatform dat particulieren met elkaar verbindt om fietsen te huren in Brussel en omgeving. Het idee: iedereen gemakkelijk een fiets in de buurt laten vinden — stadsfiets, elektrisch, MTB, bakfiets… — en eigenaars hun fiets laten benutten wanneer ze die niet gebruiken. Alles vanuit een geest van <strong>zachte mobiliteit</strong>, deeleconomie en gezelligheid.
about.author.title=De auteur
about.author.role=Student — ICC Brussel
about.author.text=BikeShare is mijn <strong>eindwerk (TFE)</strong>. Als liefhebber van webontwikkeling en nieuwe technologieën wilde ik een volledige applicatie bouwen — van de back-end tot de gebruikerservaring — rond een onderwerp dat me na aan het hart ligt: mobiliteit en delen. Dankzij dit project kon ik al mijn vaardigheden in de praktijk brengen: ontwerp, beveiliging, online betaling en deployment, op een echt en bruikbaar product.
about.author.note=(Tekst vrij aan te passen.)
about.underhood.title=Onder de motorkap
about.underhood.intro=Enkele technologieën die voor dit project zijn gebruikt:
about.browseBikes=Bekijk de fietsen →
about.contactUs=Contacteer ons

