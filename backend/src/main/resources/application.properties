# ===== BikeShare - Configuration =====
# Les valeurs ${VAR:defaut} utilisent la variable d'environnement VAR si elle existe,
# sinon la valeur par defaut (developpement local). En production (Railway), on
# definit ces variables ; en local, rien a changer.
spring.application.name=BikeShare

# --- Serveur (le port est fourni par l'hebergeur en production) ---
server.port=${PORT:8080}
# Derriere un proxy TLS (Railway) : respecter X-Forwarded-* (schema https), ce qui
# corrige l'origine vue par l'app (handshake WebSocket) et les redirections (login).
server.forward-headers-strategy=framework

# --- Mot de passe oublie ---
# Mode demo : afficher le lien de reinitialisation a l'ecran (utile si le SMTP n'est pas
# configure, ex. sur Railway sans identifiants Gmail). A laisser false en production reelle.
app.password-reset.expose-link=${PASSWORD_RESET_EXPOSE_LINK:false}

# --- Base de donnees MySQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:\
  jdbc:mysql://localhost:3306/bikeshare?useSSL=false&serverTimezone=Europe/Brussels}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Internationalisation (messages) ---
# Le francais est dans le fichier par defaut messages.properties (pas de messages_fr).
# Sans cette ligne, demander la locale "fr" (sans fichier dedie) fait retomber Spring
# sur la locale SYSTEME du serveur - anglais sur le conteneur Linux de Railway - au
# lieu du fichier par defaut. On force donc le repli vers messages.properties (FR).
spring.messages.fallback-to-system-locale=false
spring.messages.encoding=UTF-8

# --- Thymeleaf ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
# Bufferise toute la page avant de l'envoyer : evite "Cannot create a session after
# the response has been committed" lors de l'ajout du token CSRF sur les pages longues.
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# --- Upload de fichiers (photos de velos, documents) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Email (verification de compte, notifications) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Timeouts SMTP : eviter qu'une connexion bloquee ne traine (5 s max par etape).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Envoi d'email via l'API HTTPS de Brevo (recommande en prod, contourne le blocage SMTP).
# Si BREVO_API_KEY est defini, l'app utilise Brevo ; sinon elle retombe sur le SMTP ci-dessus.
brevo.api.key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:no-reply@bikeshare.be}
app.mail.from-name=${MAIL_FROM_NAME:BikeShare}

# --- Stripe (paiements) ---
stripe.api.key=${STRIPE_API_KEY:sk_test_your_stripe_key}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}

# --- Google Maps (geolocalisation des velos) ---
# Cle fournie via la variable d'environnement GOOGLE_MAPS_API_KEY (jamais en dur dans le depot).
# Sans cle, la fiche d'un velo affiche l'adresse en texte (repli) au lieu de la carte interactive.
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
